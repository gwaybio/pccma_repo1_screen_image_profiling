# SK-N-AS: everything that differs between screens in the bulk-profile steps (read by utils/bulk_pipeline.py: load_config).
# Every key is required. Relative paths are relative to this folder (3.process_features). The plate layout (which columns hold
# controls and compounds) is not here: it is read from the platemaps.

# ---- the screen ----
cell_line: SK-N-AS
screen_name: SK-N-AS_repo1_screen                 # prefixes every saved table
profiles_dir: ~/mnt/bandicoot/PCCMA_data/SK-N-AS_repo1_profiles
# profiles_dir is the screen's folder on the bandicoot mount: well cell counts, the pooled bulk profiles and the correction tables
# are written to <profiles_dir>/bulk_profiles (the PROFILES_DIR environment variable overrides it)

# ---- inputs ----
# one converted profile per plate before QC, from 0.convert_cytotable.ipynb (tens of GB per plate); the first folder that
# exists is used: the PetaLibrary "koala" mount on Alpine (HPC), the external drive locally, else this checkout's data folder
raw_profile_dirs:
  - /pl/active/koala/ALSF_screen_data/SK-N-AS_repo1_profiles/converted_profiles
  - /media/18tbdrive2/SK-N-AS_repo1_profiles/converted_profiles
  - data/converted_profiles
raw_profile_suffix: "_converted.parquet"     # what follows the plate id in the raw profile file names
platemap_dir: ../0.download_data/metadata
barcode_platemap_file: barcode_platemap.csv     # one row per plate: its barcode and its platemap file
platemap_columns: [Plate_Barcode, File_Name]     # the plate-barcode and platemap-file columns of that file
platemap_rename: {}     # renames applied to every platemap before annotation
annotate_join_on: [Metadata_Well_Position, Image_Metadata_Well]   # [platemap column, profile column]
nuclei_location_columns: [Nuclei_Location_Center_X, Nuclei_Location_Center_Y]

# ---- outputs of the per-plate steps (and where the whole-screen steps read them back) ----
qc_dir: data/qc_results
annotated_dir: data/annotated_profiles
bulk_dir: data/bulk_profiles
annotated_subdir: annotated_profiles     # under profiles_dir
annotated_glob: "*_annotated.parquet"
per_plate_glob: "*_bulk_aggregated.parquet"
